name: Sync to Hugging Face

# Mirrors upstream openai/math into this fork, then syncs the tree
# to the Hugging Face dataset roseking/openAI-math-dataset.
# HF_TOKEN must be set as a repository Action secret.

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC (10:00 GMT+8)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-to-hf
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Sync fork with upstream openai/math
        id: upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openai/math.git
          git fetch upstream main
          # Keep the workflow's own commits on main: merge upstream instead of
          # resetting, so .github/workflows/sync-to-hf.yml is never wiped out.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream main already contained in HEAD; nothing to sync"
          else
            git merge --no-edit -X ours upstream/main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Fork merged with upstream main"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub (with Xet backend)
        run: pip install -U huggingface_hub hf_xet

      - name: Upload to Hugging Face dataset
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_folder(
              folder_path=".",
              repo_id="roseking/openAI-math-dataset",
              repo_type="dataset",
              commit_message=f"Sync from openai/math@{os.environ['GITHUB_SHA'][:12]}",
              ignore_patterns=[".github/**", "README.md"],
              delete_patterns=[
                  "lean/**",
                  "preprints/**",
                  "reasoning_traces/**",
                  "CONTENTS.md",
                  "history.md",
                  "LICENSE",
                  "overview.pdf",
                  "overview.tex",
              ],
          )
          print("Commit:", info.commit_url)
          EOF
